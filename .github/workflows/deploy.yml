name: Deploy to EC2

on:
  # Manual deployment trigger
  workflow_dispatch:
    inputs:
      backend_image:
        description: 'Backend image tag (e.g., ghcr.io/username/urace-backend:abc1234)'
        required: false
      frontend_image:
        description: 'Frontend image tag (e.g., ghcr.io/username/urace-frontend:abc1234)'
        required: false
      worker_image:
        description: 'Worker image tag (e.g., ghcr.io/username/urace-worker:abc1234)'
        required: false
  
  # Webhook triggers from other repositories
  repository_dispatch:
    types: [backend-deployed, frontend-deployed, full-deploy]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository_owner }}/urace-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository_owner }}/urace-frontend
  WORKER_IMAGE_NAME: ${{ github.repository_owner }}/urace-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Determine image tags
      id: images
      run: |
        # Use manual inputs if provided, otherwise use webhook payload, otherwise use latest
        BACKEND_IMAGE="${{ github.event.inputs.backend_image }}"
        FRONTEND_IMAGE="${{ github.event.inputs.frontend_image }}"
        WORKER_IMAGE="${{ github.event.inputs.worker_image }}"
        
        # If webhook payload exists, use those images
        if [ -n "${{ github.event.client_payload.backend_image }}" ]; then
          BACKEND_IMAGE="${{ github.event.client_payload.backend_image }}"
          WORKER_IMAGE="${{ github.event.client_payload.worker_image }}"
        fi
        
        if [ -n "${{ github.event.client_payload.frontend_image }}" ]; then
          FRONTEND_IMAGE="${{ github.event.client_payload.frontend_image }}"
        fi
        
        # Default to latest if no specific image provided
        if [ -z "$BACKEND_IMAGE" ]; then
          BACKEND_IMAGE="${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest"
        fi
        if [ -z "$FRONTEND_IMAGE" ]; then
          FRONTEND_IMAGE="${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest"
        fi
        if [ -z "$WORKER_IMAGE" ]; then
          WORKER_IMAGE="${{ env.REGISTRY }}/${{ env.WORKER_IMAGE_NAME }}:latest"
        fi
        
        echo "backend_image=$BACKEND_IMAGE" >> $GITHUB_OUTPUT
        echo "frontend_image=$FRONTEND_IMAGE" >> $GITHUB_OUTPUT
        echo "worker_image=$WORKER_IMAGE" >> $GITHUB_OUTPUT
        
        echo "Deploying:"
        echo "Backend: $BACKEND_IMAGE"
        echo "Frontend: $FRONTEND_IMAGE" 
        echo "Worker: $WORKER_IMAGE"

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to EC2
      run: |
        ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} '
          # Navigate to project directory
          cd /home/ec2-user/urace
          
          # Login to GitHub Container Registry
          echo ${{ secrets.GIT_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          
          # Check deployment type and restart only relevant services
          if [ "${{ github.event.action }}" = "backend-deployed" ]; then
            echo "Backend-only deployment - restarting backend and worker services..."
            
            # Update only backend and worker images in docker-compose file
            echo "Before sed - checking current images:"
            grep "image: ghcr.io" docker-compose.yml || true
            
            sed -i "s|image: ghcr.io/.*/urace-backend:.*|image: ${{ steps.images.outputs.backend_image }}|" docker-compose.yml
            sed -i "s|image: ghcr.io/.*/urace-worker:.*|image: ${{ steps.images.outputs.worker_image }}|" docker-compose.yml
            
            echo "After sed - updated images:"
            grep "image: ghcr.io" docker-compose.yml || true
            
            # Stop and remove backend services only
            docker-compose stop urace-backend activity-worker || true
            docker-compose rm -f urace-backend activity-worker || true
            
            # Remove old images to force fresh pull
            docker rmi ${{ steps.images.outputs.backend_image }} || true
            docker rmi ${{ steps.images.outputs.worker_image }} || true
            
            # Pull new backend and worker images
            docker-compose pull urace-backend activity-worker
            
            # Start backend services
            docker-compose up -d urace-backend activity-worker
            
          elif [ "${{ github.event.action }}" = "frontend-deployed" ]; then
            echo "Frontend-only deployment - restarting frontend service..."
            
            # Update only frontend image in docker-compose file
            echo "Before sed - checking current images:"
            grep "image: ghcr.io" docker-compose.yml || true
            
            sed -i "s|image: ghcr.io/.*/urace-frontend:.*|image: ${{ steps.images.outputs.frontend_image }}|" docker-compose.yml
            
            echo "After sed - updated images:"
            grep "image: ghcr.io" docker-compose.yml || true
            
            # Stop and remove frontend service and caddy (which also uses the volume)
            docker-compose stop urace-frontend caddy || true
            docker-compose rm -f urace-frontend caddy || true
            
            # Remove any dangling containers that might use the volume
            docker container prune -f || true
            
            # Remove frontend volume for fresh build (correct volume name)
            docker volume rm urace_frontend_build || true
            
            # Remove old image to force fresh pull
            docker rmi ${{ steps.images.outputs.frontend_image }} || true
            
            # Pull new frontend image
            docker-compose pull urace-frontend
            
            # Start frontend service and caddy
            docker-compose up -d urace-frontend caddy
            
          else
            echo "Full deployment - restarting all services..."
            
            # Update all images in docker-compose file
            echo "Before sed - checking current images:"
            grep "image: ghcr.io" docker-compose.yml || true
            
            sed -i "s|image: ghcr.io/.*/urace-backend:.*|image: ${{ steps.images.outputs.backend_image }}|" docker-compose.yml
            sed -i "s|image: ghcr.io/.*/urace-worker:.*|image: ${{ steps.images.outputs.worker_image }}|" docker-compose.yml  
            sed -i "s|image: ghcr.io/.*/urace-frontend:.*|image: ${{ steps.images.outputs.frontend_image }}|" docker-compose.yml
            
            echo "After sed - updated images:"
            grep "image: ghcr.io" docker-compose.yml || true
            
            # Stop all services first
            docker-compose down || true
            
            # Remove any dangling containers that might use the volume
            docker container prune -f || true
            
            # Remove frontend volume after all containers are stopped
            echo "Removing frontend volume..."
            docker volume rm urace_frontend_build || true
            
            # Remove old images to force fresh pull
            docker rmi ${{ steps.images.outputs.backend_image }} || true
            docker rmi ${{ steps.images.outputs.frontend_image }} || true
            docker rmi ${{ steps.images.outputs.worker_image }} || true
            
            # Pull all new images
            docker-compose pull
            
            # Start all services
            docker-compose up -d
          fi
          
          # Health check
          echo "Waiting for services to be healthy..."
          sleep 30
          
          # Check if backend is responding
          if curl -f http://localhost/api/health 2>/dev/null; then
            echo "✅ Deployment successful - API is responding"
          else
            echo "⚠️ Warning: API health check failed, but deployment completed"
          fi
          
          # Clean up old images to save space
          echo "Cleaning up old images..."
          docker image prune -f
          
          echo "🚀 Deployment completed!"
        '